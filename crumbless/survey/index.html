<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B4E">
<meta name="description" content="Know what is in it before you eat it, whatever your diet. Tell Crumbless what you need: 4 minutes, no name needed, Arabic or English.">
<title>Crumbless Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one notebook page. Ruled paper, hand-written margin notes, the survey as a stack of index cards.
   Colours and type follow Crumbless brand v2 "Market notebook": herb for actions, tomato only for warnings, honey for "ask". */
:root {
  --page: #E6DCC6; --paper: #F4EEE2; --paper2: #FCF8F0; --rule: #E2D8C4; --leaf: #DDEBDD;
  --ink: #2A2F2B; --muted: #5A625C; --act: #2E6B4E; --on-act: #FFFFFF; --warn: #B23A26; --ask: #E7B550;
  --focus: #2E6B4E; --shadow: 0 1px 0 rgba(42,47,43,.07), 0 10px 28px -14px rgba(42,47,43,.32);
  --hand: 'Caveat', cursive;
  --body: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #141a17; --paper: #1A211D; --paper2: #252E29; --rule: #34403A; --leaf: #22362B;
  --ink: #EEF1EA; --muted: #A9B3AB; --act: #8FD0AE; --on-act: #10231A; --warn: #F2917F; --ask: #EBC46E;
  --focus: #8FD0AE; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7); color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #141a17; --paper: #1A211D; --paper2: #252E29; --rule: #34403A; --leaf: #22362B;
  --ink: #EEF1EA; --muted: #A9B3AB; --act: #8FD0AE; --on-act: #10231A; --warn: #F2917F; --ask: #EBC46E;
  --focus: #8FD0AE; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; margin: 0; }
.sheet { max-width: 880px; margin: 0 auto; background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px; min-height: 100%; box-shadow: var(--shadow); }
.inner { max-width: 720px; margin: 0 auto; display: grid; gap: 56px; }
a { color: var(--act); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2 { font-family: var(--body); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(36px, 7vw, 58px); }
h2 { font-size: clamp(26px, 4.4vw, 34px); }
.hand { font-family: var(--hand); font-size: 24px; color: var(--act); line-height: 1.1; }
:lang(ar) .hand { font-family: var(--body); font-weight: 700; font-size: 17px; }
.muted { color: var(--muted); font-size: 15px; }
p { margin: 0; max-width: 62ch; }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 30px/1 var(--hand); color: var(--act); }
:lang(ar) .brand { font: 700 20px var(--body); }
.brand svg { width: 40px; height: 40px; }
.lang { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 600 15px var(--body); padding: 8px 16px; border-radius: 999px; cursor: pointer; min-height: 44px; }
.lang:hover { background: var(--paper2); }

/* hero */
.hero { display: grid; gap: 22px; padding-top: 18px; }
.hero .mark { width: 120px; height: 120px; }
.mark path { fill: var(--act); stroke: var(--act); stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
.draw path { stroke-dasharray: 2600; stroke-dashoffset: 0; animation: draw 2.4s ease-out both, fillin 2.4s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 2600; } to { stroke-dashoffset: 0; } }
@keyframes fillin { 0%, 55% { fill-opacity: 0; } 100% { fill-opacity: 1; } }
.hero .lede { font-size: 19px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1.5px dashed var(--act); color: var(--act); padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--paper); }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--act); color: var(--on-act); border: 0; font: 700 18px var(--body); padding: 14px 26px; border-radius: 14px; cursor: pointer; min-height: 52px; justify-self: start; box-shadow: 0 3px 0 color-mix(in srgb, var(--act) 60%, var(--ink)); transition: transform .12s ease, box-shadow .12s ease; text-decoration: none; }
.cta:hover { transform: translateY(-1px); box-shadow: 0 4px 0 color-mix(in srgb, var(--act) 60%, var(--ink)); }
.cta:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--act) 60%, var(--ink)); }
.cta .arr { display: inline-block; transition: transform .2s ease; }
.cta:hover .arr { transform: translateX(4px); }
:dir(rtl) .cta .arr { transform: scaleX(-1); }
:dir(rtl) .cta:hover .arr { transform: scaleX(-1) translateX(4px); }

/* facts */
.section { display: grid; gap: 20px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.fact { background: var(--paper2); border-radius: 4px 14px 6px 12px; padding: 18px 18px 14px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); min-width: 0; transform: rotate(var(--tilt, 0deg)); }
.fact:nth-child(3n+1) { --tilt: -.6deg; } .fact:nth-child(3n+2) { --tilt: .5deg; } .fact:nth-child(3n) { --tilt: -.25deg; }
.num { font: 700 44px/1 var(--body); color: var(--act); font-variant-numeric: tabular-nums; }
.fact p { font-size: 15.5px; }
.src { font-size: 13px; color: var(--muted); }
.src a { color: var(--muted); }
.note { border-inline-start: 3px solid var(--ask); padding-inline-start: 14px; font-size: 15px; color: var(--muted); }
.takeaway { font-size: 19px; }

/* hidden gluten */
.hidden-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 20px; margin: 0; padding: 0; list-style: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); font: 600 15.5px var(--body); padding: 8px 16px; border-radius: 999px; cursor: pointer; min-height: 44px; transition: background .15s ease, border-color .15s ease, transform .12s ease; }
.chip:hover { border-color: var(--act); }
.chip[aria-selected="true"] { background: var(--act); color: var(--on-act); border-color: var(--act); transform: rotate(-1deg); }
.forpanel { background: var(--paper2); border-radius: 6px 16px 8px 14px; box-shadow: var(--shadow); padding: 20px clamp(18px, 4vw, 28px); }
.forpanel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.forpanel li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; min-width: 0; }
.forpanel li svg { width: 22px; height: 22px; margin-top: 3px; stroke: var(--act); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 0; }
.forpanel.swap li { animation: rise .35s ease-out both; } .forpanel.swap li:nth-child(2) { animation-delay: .06s; } .forpanel.swap li:nth-child(3) { animation-delay: .12s; }
.forpanel.swap li svg { animation: drawtick .5s ease-out both; }
@keyframes drawtick { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
.hidden-list li { padding: 10px 0; border-bottom: 1.5px dashed var(--rule); display: grid; gap: 2px; min-width: 0; }
.hidden-list b { color: var(--act); }
.hidden-list span { font-size: 14.5px; color: var(--muted); }

/* survey */
.survey { display: grid; gap: 14px; scroll-margin-top: 16px; }
.progress { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 10px; position: relative; }
.track svg { width: 100%; height: 10px; display: block; overflow: visible; }
.track .bg { stroke: var(--rule); }
.track .fg { stroke: var(--act); transition: stroke-dashoffset .45s ease; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); min-width: 4.5em; text-align: end; }
.card { background: var(--paper2); border-radius: 6px 16px 8px 14px; box-shadow: var(--shadow); padding: 24px clamp(18px, 4vw, 32px); display: grid; gap: 16px; min-height: 320px; align-content: start; }
.card.in { animation: cardin .3s ease both; }
.card.in.back { animation-name: cardback; }
@keyframes cardin { from { opacity: .2; transform: translateX(28px) rotate(.6deg); } to { opacity: 1; transform: none; } }
@keyframes cardback { from { opacity: .2; transform: translateX(-28px) rotate(-.6deg); } to { opacity: 1; transform: none; } }
:dir(rtl) .card.in { animation-name: cardback; } :dir(rtl) .card.in.back { animation-name: cardin; }
.q { font-size: 22px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.hint { font-size: 14px; color: var(--muted); margin-top: -8px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: start; width: 100%; background: var(--paper); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 12px; padding: 11px 14px; font: 500 16.5px var(--body); cursor: pointer; min-height: 48px; transition: border-color .12s ease, background .12s ease, transform .12s ease; }
.opt:hover { border-color: var(--act); }
.opt:active { transform: scale(.99); }
.opt .box { flex: none; width: 24px; height: 24px; border: 1.8px solid var(--act); border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--body); color: var(--on-act); }
.opt.multi .box { border-radius: 6px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--act); background: var(--leaf); }
.opt[aria-pressed="true"] .box, .opt[aria-checked="true"] .box { background: var(--act); border-color: var(--act); }
.opt .box svg { width: 14px; height: 14px; stroke: var(--on-act); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.opt[aria-pressed="true"] .box svg, .opt[aria-checked="true"] .box svg { animation: tick .25s ease-out forwards; }
@keyframes tick { to { stroke-dashoffset: 0; } }
textarea, input[type=email] { width: 100%; font: 16.5px var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
textarea { min-height: 120px; resize: vertical; }
textarea:focus, input[type=email]:focus { border-color: var(--act); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--act) 35%, transparent); }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.consent input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--act); flex: none; }
.nav { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.ghost { background: transparent; border: 0; color: var(--muted); font: 600 16px var(--body); padding: 10px 6px; cursor: pointer; min-height: 44px; }
.ghost:hover { color: var(--ink); }
.ghost[disabled] { visibility: hidden; }
.next[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.err { color: var(--warn); font-size: 14.5px; }
.banner { background: color-mix(in srgb, var(--ask) 28%, var(--paper2)); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; }
.done { text-align: center; justify-items: center; align-content: center; }
.done .mark { width: 96px; height: 96px; }
.privacy { display: grid; gap: 10px; }
.privacy ul { margin: 0; padding-inline-start: 22px; display: grid; gap: 4px; }
.addr { font-family: ui-monospace, Menlo, monospace; font-size: 15px; user-select: all; background: var(--paper2); padding: 2px 6px; border-radius: 6px; }
.reveal { animation: rise .6s ease-out both; }
.reveal:nth-child(2) { animation-delay: .08s; } .reveal:nth-child(3) { animation-delay: .16s; } .reveal:nth-child(4) { animation-delay: .24s; } .reveal:nth-child(5) { animation-delay: .32s; } .reveal:nth-child(6) { animation-delay: .4s; }
@keyframes rise { from { opacity: .35; transform: translateY(10px) rotate(var(--tilt, 0deg)); } to { opacity: 1; transform: rotate(var(--tilt, 0deg)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 480px) { body { font-size: 16px; } .num { font-size: 38px; } .q { font-size: 20px; } .card { min-height: 0; } }
</style>
</head>

const COUNTED = QS.length - 1;

let lang = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ar';
try { const s = localStorage.getItem('cb-survey-lang'); if (s === 'en' || s === 'ar') lang = s; } catch (e) {}
const ans = {};      // in memory only: health answers are never written to storage
let lastWho = null;
let step = 0, ending = null, dir = 1, sending = false, errMsg = '';
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]).replace('.', '٫');
const fmt = n => lang === 'ar' ? toAr(n) : String(n);
const t = k => T[lang][k];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const preview = !FORM.action;
const TICK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function applyLang() {
  const root = document.documentElement;
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#lang').textContent = t('langBtn');
  $('#lang').setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
  $('#previewBanner').hidden = !preview;
  $('#facts').innerHTML = FACTS.map((f, i) => `<article class="fact reveal"><div class="num" data-n="${f.n}" data-d="${f.d}">${fmt(f.n.toFixed(f.d))}${lang === 'ar' ? '٪' : '%'}</div><p>${esc(f[lang])}</p><div class="src"><a href="${f.url}" target="_blank" rel="noopener">${esc(lang === 'ar' ? f.srcAr : f.src)}</a></div></article>`).join('');
  $('#hidden').innerHTML = HIDDEN.map(h => `<li><b>${esc(h[lang])}</b><span>${esc(lang === 'ar' ? h.whyAr : h.why)}</span></li>`).join('');
  renderFor(false);
  countUp();
  render(false);
}

function renderFor(anim) {
  $('#chips').innerHTML = FOR.map((f, i) => `<button type="button" class="chip" role="tab" id="chip${i}" aria-selected="${i === forSel}" aria-controls="forpanel" tabindex="${i === forSel ? 0 : -1}" data-i="${i}">${esc(f[lang])}</button>`).join('');
  const f = FOR[forSel], panel = $('#forpanel');
  panel.setAttribute('aria-labelledby', 'chip' + forSel);
  panel.innerHTML = `<ul>${f.pts.map(p => `<li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6"/></svg><span>${esc(lang === 'ar' ? p[1] : p[0])}</span></li>`).join('')}</ul>`;
  panel.classList.remove('swap'); if (anim) { void panel.offsetWidth; panel.classList.add('swap'); }
  document.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { forSel = +b.dataset.i; renderFor(true); $('#chip' + forSel).focus(); };
    b.onkeydown = e => { const k = e.key, rtl = lang === 'ar';
      const d = k === 'ArrowRight' ? (rtl ? -1 : 1) : k === 'ArrowLeft' ? (rtl ? 1 : -1) : 0;
      if (d) { e.preventDefault(); forSel = (forSel + d + FOR.length) % FOR.length; renderFor(true); $('#chip' + forSel).focus(); } };
  });
}

function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    const el = e.target, n = +el.dataset.n, d = +el.dataset.d, pct = lang === 'ar' ? '٪' : '%', t0 = performance.now();
    const tick = now => { const p = Math.min(1, (now - t0) / 1100), v = n * (1 - Math.pow(1 - p, 3));
      el.textContent = fmt(v.toFixed(d)) + pct; if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }), { threshold: .6 });
  document.querySelectorAll('.num').forEach(el => io.observe(el));
}

function progress() {
  const done = ending ? COUNTED : Math.min(step, COUNTED);
  $('#pen').style.strokeDashoffset = String(100 - (done / COUNTED) * 100);
  $('#count').textContent = ending ? '' : (step < COUNTED ? t('of')(fmt(step + 1), fmt(COUNTED)) : t('optional').replace('.', ''));
}

function render(animate = true) {
  const card = $('#card');
  progress();
  card.classList.remove('in', 'back', 'done');
  if (ending) {
    const k = ending;
    const whoLabel = lastWho != null ? QS[0].opts[lastWho][lang] : '';
    card.classList.add('done');
    card.innerHTML = `<svg class="mark draw" viewBox="0 0 200 200" aria-hidden="true"><path fill-rule="evenodd" d="${MARKPATH}"/></svg>
      <div class="q">${esc(t(k + 'H'))}</div><p>${esc(t(k + 'P'))}</p>${k === 'done' && whoLabel ? `<p class="hand">${esc(t('doneFor') + whoLabel)}</p>` : ''}${k === 'done' && preview ? `<p class="muted">${esc(t('donePreview'))}</p>` : ''}
      <button type="button" class="ghost" id="again">${esc(t('again'))}</button>`;
    $('#again').onclick = () => { lastWho = null; for (const key in ans) delete ans[key]; step = 0; ending = null; dir = -1; render(); };
  } else {
    const q = QS[step];
    let body = '';
    if (q.type === 'email') {
      const a = ans.email || { email: '', consent: false };
      body = `<label class="q" for="em">${esc(t('emailQ'))}</label><div class="hint">${esc(t('emailHint'))}</div>
        <input type="email" id="em" autocomplete="email" inputmode="email" placeholder="${t('emailPh')}" value="${esc(a.email)}" dir="ltr">
        <label class="consent"><input type="checkbox" id="consent" ${a.consent ? 'checked' : ''}><span>${esc(t('consent'))}</span></label>`;
    } else if (q.type === 'text') {
      body = `<label class="q" for="tx">${esc(q[lang])}</label><div class="hint">${esc(t('optional'))}</div><textarea id="tx" maxlength="600">${esc(ans[q.id] || '')}</textarea>`;
    } else {
      const sel = ans[q.id] || (q.type === 'one' ? null : []);
      const hint = q.type === 'many' ? t('many') : q.type === 'rank' ? t('rankHint') : '';
      body = `<div class="q" id="qt">${esc(q[lang])}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
        <div class="opts" role="${q.type === 'one' ? 'radiogroup' : 'group'}" aria-labelledby="qt">${q.opts.map((op, i) => {
          const on = q.type === 'one' ? sel === i : sel.includes(i);
          const mark = q.type === 'rank' ? (on ? fmt(sel.indexOf(i) + 1) : '') : TICK;
          const aria = q.type === 'one' ? `role="radio" aria-checked="${on}"` : `aria-pressed="${on}"`;
          return `<button type="button" class="opt ${q.type === 'one' ? '' : 'multi'}" data-i="${i}" ${aria}><span class="box">${mark}</span><span>${esc(op[lang])}</span></button>`;
        }).join('')}</div>`;
    }
    const last = q.type === 'email';
    card.innerHTML = `${body}<div class="err" id="err" role="alert">${esc(errMsg)}</div>
      <div class="nav"><button type="button" class="ghost" id="backBtn" ${step === 0 ? 'disabled' : ''}>${esc(t('back'))}</button>
      <button type="submit" class="cta next" id="nextBtn" ${sending ? 'disabled' : ''}><span>${esc(sending ? t('sending') : last ? t('send') : t('next'))}</span><span class="arr" aria-hidden="true">→</span></button></div>`;
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(q, +b.dataset.i));
    $('#backBtn').onclick = () => { errMsg = ''; dir = -1; step--; render(); };
    const tx = $('#tx'); if (tx) tx.oninput = () => { ans[q.id] = tx.value; };
    const em = $('#em'); if (em) { const sync = () => { ans.email = { email: em.value.trim(), consent: $('#consent').checked }; }; em.oninput = sync; $('#consent').onchange = sync; }
  }
  if (animate) { void card.offsetWidth; card.classList.add('in'); if (dir < 0) card.classList.add('back'); }
}

function pick(q, i) {
  errMsg = '';
  if (q.type === 'one') {
    ans[q.id] = i; render(false);
    const op = q.opts[i];
    setTimeout(() => { if (op.end) { ending = op.end; dir = 1; render(); } else advance(); }, 260);
    return;
  }
  const arr = ans[q.id] = (ans[q.id] || []).slice();
  const at = arr.indexOf(i);
  if (at >= 0) arr.splice(at, 1); else arr.push(i);
  render(false);
  const btn = document.querySelector(`.opt[data-i="${i}"]`); if (btn) btn.focus();
}

function validate(q) {
  if (q.type === 'one' && ans[q.id] == null) return t('required');
  if (q.type === 'many' && !(ans[q.id] || []).length) return t('required');
  if (q.type === 'rank' && (ans[q.id] || []).length < q.min) return t('rankNeed')(q.min);
  if (q.type === 'email') {
    const a = ans.email || { email: '', consent: false };
    if (a.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a.email)) return t('emailBad');
    if (a.email && !a.consent) return t('consentNeed');
  }
  return '';
}

function advance() { dir = 1; step++; render(); $('#survey').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

function payload() {
  const out = {};
  QS.forEach(q => {
    const a = ans[q.id];
    if (q.type === 'one') out[q.id] = a == null ? '' : q.opts[a].en;
    else if (q.type === 'many') out[q.id] = (a || []).map(i => q.opts[i].en).join('; ');
    else if (q.type === 'rank') out[q.id] = (a || []).map((i, n) => (n + 1) + '. ' + q.opts[i].en).join('; ');
    else if (q.type === 'text') out[q.id] = (a || '').trim();
  });
  const e = ans.email || {};
  if (e.email && e.consent) { out.email = e.email; out.consent = 'yes'; } else { out.email = ''; out.consent = 'no'; }
  out.survey_lang = lang;
  return out;
}

async function submit() {
  if (preview) { lastWho = ans.who; ending = 'done'; dir = 1; render(); return; }
  sending = true; render(false);
  try {
    const body = new URLSearchParams();
    const p = payload();
    for (const k in p) if (FORM.entries[k] && p[k] !== '') body.append(FORM.entries[k], p[k]);
    await fetch(FORM.action, { method: 'POST', mode: 'no-cors', body });
    sending = false; lastWho = ans.who; for (const key in ans) delete ans[key]; ending = 'done'; dir = 1; render();
  } catch (e) { sending = false; errMsg = t('sendFail'); render(false); }
}
